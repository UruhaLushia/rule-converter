[package]
name = "rule-converter"
version = "0.3.1"
edition = "2024"

[workspace]
members = [".", "napi", "wasm"]

[features]
default = ["cli", "parallel", "http"]
cli = ["config", "dep:clap", "http"]
config = ["dep:serde_yaml", "dep:toml"]
http = ["dep:ureq"]
parallel = ["dep:rayon"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = "symbols"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"], optional = true }
yaml-rust2 = { version = "0.11.0", default-features = false }
zstd = { version = "0.13", default-features = false }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = { version = "0.9", optional = true }
toml = { version = "1", optional = true }
rayon = { version = "1.12", optional = true }
maxminddb = "0.28"
maxminddb-writer = "0.1"
prost = "0.14"
regex = "1"
ureq = { version = "3.3", default-features = false, features = ["rustls", "gzip"], optional = true }
